<!DOCTYPE html>
<html lang="en">
<head>
    {% include "shared/head_theme.html" %}
    {% include "shared/head_common.html" %}
    <title>Login – Beacon</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='%233b7dd8' stroke-width='3'/%3E%3C/svg%3E" />
</head>
<body class="beacon-login">
    <main class="inst-panel beacon-login-card">
        <div class="inst-panel-body inst-stack">
            <p class="beacon-brand">
                <span class="inst-dot" data-tone="ok" aria-hidden="true"></span>Beacon
            </p>

            {% if error %}
            <div class="inst-note" data-tone="error" role="alert">Invalid username or password.</div>
            {% endif %}

            <form method="post" action="/login" class="inst-stack">
                <div class="inst-field">
                    <label class="inst-label" for="username">Username</label>
                    <input class="inst-input" type="text" id="username" name="username" required autofocus autocomplete="username">
                </div>
                <div class="inst-field">
                    <label class="inst-label" for="password">Password</label>
                    <input class="inst-input" type="password" id="password" name="password" required autocomplete="current-password">
                </div>
                <button type="submit" class="inst-btn inst-btn--primary inst-btn--lg">Sign in</button>
            </form>
        </div>
    </main>
</body>
</html>
