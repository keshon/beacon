<div >
    <div class="inst-panel-raised">
        <div class="inst-panel-body">
            <div class="inst-panel-title">{{ title }}</div>
            <div class="notify-channel-panel" data-notify-channel-panel="{{ channel }}">
                <div class="inst-segmented" data-notify-mode role="group">
                    <button type="button" class="inst-btn inst-btn--sm is-active" data-mode="inherit">Global</button>
                    <button type="button" class="inst-btn inst-btn--sm" data-mode="custom">Custom</button>
                    <button type="button" class="inst-btn inst-btn--sm" data-mode="off">Off</button>
                </div>
                <p class="inst-u-dim" data-notify-mode-hint>Uses global settings for this channel.</p>
                <div data-notify-channel-body >
                    <div data-notify-channel="{{ channel }}">
                        <div data-notify-list></div>
                        <div >
                            <button type="button" class="inst-btn inst-btn--sm" data-notify-add>Add</button>
                            <span class="inst-label" data-notify-helper></span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
