{# Строка списка узлов. Expects: n #}
<div class="inst-task">
    <span class="inst-task-gutter">
        <span class="inst-dot" data-tone="{% if n.Status == 'live' %}ok{% elif n.Status == 'dead' %}error{% elif n.Status == 'self' %}running{% else %}neutral{% endif %}"></span>
    </span>
    <span class="inst-task-main">
        <span class="inst-task-title inst-u-truncate inst-u-mono">{% if n.NodeID %}{{ n.NodeID }}{% else %}{{ n.NodeIDShort }}{% endif %}</span>
        <span class="inst-task-sub inst-u-truncate"><a href="{{ n.URL }}" target="_blank" rel="noopener">{{ n.URL }}</a></span>
        {% if n.LastError %}<span class="inst-task-sub beacon-error">{{ n.LastError }}</span>{% endif %}
    </span>
    <span class="inst-task-meta inst-cluster">
        {% include "./shared/status.html" with status=n.Status %}
        <span>Last seen {{ n.LastSeen }}</span>
        <span class="inst-num">{{ n.MonitorsCount }}</span>
    </span>
</div>
