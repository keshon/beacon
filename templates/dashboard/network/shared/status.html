{# Состояние узла. Expects: status #}
{% if status == 'self' %}
<span class="inst-badge" data-tone="running"><span class="inst-dot"></span>This node</span>
{% elif status == 'live' %}
<span class="inst-badge" data-tone="ok"><span class="inst-dot"></span>Live</span>
{% elif status == 'dead' %}
<span class="inst-badge" data-tone="error"><span class="inst-dot"></span>Dead</span>
{% else %}
<span class="inst-badge" data-tone="neutral"><span class="inst-dot"></span>Unknown</span>
{% endif %}
