{# Тема ставится ДО первой отрисовки, иначе экран моргает светлым. #}
{# #}
{# Атрибут кита — data-theme, шесть тем. Нет атрибута — тема по настройке ОС, #}
{# и это отдельное значение «system», а не синоним светлой. #}
<script>
    (function () {
        try {
            var t = localStorage.getItem('beaconTheme');
            if (t && t !== 'system') document.documentElement.setAttribute('data-theme', t);
        } catch (e) { }
        try {
            var d = localStorage.getItem('beaconDensity');
            if (d) document.documentElement.setAttribute('data-density', d);
        } catch (e) { }
        try {
            var dv = localStorage.getItem('beaconDashboardView');
            if (dv === 'grid') dv = 'list';
            document.documentElement.setAttribute(
                'data-dashboard-view',
                (dv === 'list' || dv === 'table' || dv === 'cards') ? dv : 'cards'
            );
        } catch (e) {
            document.documentElement.setAttribute('data-dashboard-view', 'cards');
        }
    })();
</script>
